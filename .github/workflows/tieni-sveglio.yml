name: Tieni sveglio il database

# Il piano gratuito di Supabase mette in pausa un progetto dopo 7 giorni senza richieste.
# Ogni 3 giorni una lettura leggera (versione minima dell'app, pubblica) lo tiene attivo.

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  sveglia:
    runs-on: ubuntu-latest
    steps:
      - name: Lettura leggera
        run: |
          curl -fsS "${{ vars.SUPABASE_URL || 'https://mxotaznwiuysvwswbrrs.supabase.co' }}/rest/v1/compatibilita?select=versione_minima_app" \
            -H "apikey: ${{ vars.SUPABASE_CHIAVE || 'sb_publishable_h6O3wJJvEUMACnNjc1r2Ww_EuS4vKG0' }}" -H "Authorization: Bearer ${{ vars.SUPABASE_CHIAVE || 'sb_publishable_h6O3wJJvEUMACnNjc1r2Ww_EuS4vKG0' }}"
