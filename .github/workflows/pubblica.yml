name: Pubblica

# A ogni modifica di main: applica le migrazioni al database Supabase, poi pubblica l'app su GitHub Pages.
# Segreti richiesti (Settings → Secrets → Actions): SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD. Il progetto (mxotaznwiuysvwswbrrs) è pubblico, è nell'indirizzo.
# Variabili pubbliche facoltative (Settings → Variables → Actions): SUPABASE_URL, SUPABASE_CHIAVE; senza, si usa il progetto di Luca.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Applica le migrazioni
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF || 'mxotaznwiuysvwswbrrs' }}" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

  app:
    needs: database
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://mxotaznwiuysvwswbrrs.supabase.co' }}
          VITE_SUPABASE_CHIAVE: ${{ vars.SUPABASE_CHIAVE || 'sb_publishable_h6O3wJJvEUMACnNjc1r2Ww_EuS4vKG0' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pubblicazione
        uses: actions/deploy-pages@v4
