name: Pubblica

# A ogni modifica di main: applica le migrazioni al database Supabase, poi pubblica l'app su GitHub Pages.
# Segreti richiesti (Settings → Secrets → Actions): SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD; facoltativo GEMINI_API_KEY (foto del frigo). Il progetto (mxotaznwiuysvwswbrrs) è pubblico, è nell'indirizzo.
# Variabili pubbliche facoltative (Settings → Variables → Actions): SUPABASE_URL, SUPABASE_CHIAVE; senza, si usa il progetto di Luca.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Applica le migrazioni
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF || 'mxotaznwiuysvwswbrrs' }}" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

  app:
    needs: database
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://mxotaznwiuysvwswbrrs.supabase.co' }}
          VITE_SUPABASE_CHIAVE: ${{ vars.SUPABASE_CHIAVE || 'sb_publishable_h6O3wJJvEUMACnNjc1r2Ww_EuS4vKG0' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pubblicazione
        uses: actions/deploy-pages@v4

  # Separata dall'app: se la funzione non si pubblica, l'app esce lo stesso (e la foto dice che non è attiva).
  funzioni:
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Pubblica la funzione della foto del frigo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          REF="${{ vars.SUPABASE_PROJECT_REF || 'mxotaznwiuysvwswbrrs' }}"
          supabase functions deploy foto-frigo --project-ref "$REF" --use-api
          # La chiave Gemini va solo nei segreti del server; senza, l'app dice che la foto non è ancora attiva.
          if [ -n "$GEMINI_API_KEY" ]; then
            supabase secrets set --project-ref "$REF" GEMINI_API_KEY="$GEMINI_API_KEY"
          else
            echo "GEMINI_API_KEY non impostata: la foto del frigo resta spenta."
          fi
